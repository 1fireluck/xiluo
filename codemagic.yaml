workflows:
  ios-unsigned:
    name: iOS unsigned ipa
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: create project
        script: |
          flutter create --org com.fireluck --project-name xiluo --platforms=ios .
      - name: strip input assistant
        script: |
          cat > ios/Runner/AppDelegate.swift <<'SWIFT'
          import Flutter
          import UIKit
          import WebKit
          import ObjectiveC
          
          private let heroEmptyAssistant = UITextInputAssistantItem()
          
          extension UIView {
            @objc func hero_inputAssistantItem() -> UITextInputAssistantItem {
              return heroEmptyAssistant
            }
          }
          
          private func heroHookClass(_ name: String) {
            guard let cls = NSClassFromString(name) else { return }
            let sel = NSSelectorFromString("inputAssistantItem")
            guard let m = class_getInstanceMethod(cls, sel) else { return }
            let block: @convention(block) (AnyObject) -> UITextInputAssistantItem = { _ in heroEmptyAssistant }
            let imp = imp_implementationWithBlock(block)
            class_replaceMethod(cls, sel, imp, method_getTypeEncoding(m))
          }
          
          private func heroHookAll() {
            heroHookClass("WKContentView")
            heroHookClass("WKWebView")
            heroHookClass("UITextView")
            heroHookClass("UITextField")
          }
          
          @main
          @objc class AppDelegate: FlutterAppDelegate {
            override func application(
              _ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
            ) -> Bool {
              GeneratedPluginRegistrant.register(with: self)
          
              let orig = #selector(getter: UIView.inputAssistantItem)
              let repl = #selector(UIView.hero_inputAssistantItem)
              if let m1 = class_getInstanceMethod(UIView.self, orig),
                 let m2 = class_getInstanceMethod(UIView.self, repl) {
                method_exchangeImplementations(m1, m2)
              }
          
              heroHookAll()
              var ticks = 0
              Timer.scheduledTimer(withTimeInterval: 0.5, repeats: true) { timer in
                heroHookAll()
                ticks += 1
                if ticks > 120 { timer.invalidate() }
              }
          
              return super.application(application, didFinishLaunchingWithOptions: launchOptions)
            }
          }
          SWIFT
          grep -c hero_inputAssistantItem ios/Runner/AppDelegate.swift || true

      - name: add dependency
        script: |
          flutter pub add webview_flutter
      - name: copy ui
        script: |
          test -f seed/main.dart
          cp seed/main.dart lib/main.dart
      - name: register assets
        script: |
          python3 - <<'PY'
          import pathlib
          pub = pathlib.Path('pubspec.yaml')
          text = pub.read_text(encoding='utf-8')
          dirs = [l.strip() for l in pathlib.Path('seed/webdirs.txt').read_text(encoding='utf-8').splitlines() if l.strip()]
          block = '\n'.join('    - assets/%s/' % d for d in dirs)
          anchor = '  uses-material-design: true'
          if anchor in text:
              text = text.replace(anchor, anchor + '\n  assets:\n' + block, 1)
          else:
              text += '\nflutter:\n  assets:\n' + block + '\n'
          pub.write_text(text, encoding='utf-8')
          PY
      - name: plist
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName hero" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string hero" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist || true
      - name: icon
        script: |
          ICON=assets/icon.png
          if [ -f "$ICON" ]; then
            DEST=ios/Runner/Assets.xcassets/AppIcon.appiconset
            rm -rf "$DEST" && mkdir -p "$DEST"
            cp "$ICON" "$DEST/Icon-App-1024x1024@1x.png"
            printf '%s' '{"images":[{"filename":"Icon-App-1024x1024@1x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$DEST/Contents.json"
          fi
      - name: build
        script: |
          flutter build ios --release --no-codesign
      - name: pack
        script: |
          mkdir -p build_out/Payload
          cp -R build/ios/iphoneos/Runner.app build_out/Payload/
          cd build_out
          zip -qr xiluo.ipa Payload
          ls -la xiluo.ipa
    artifacts:
      - build_out/xiluo.ipa