workflows:
  ios-unsigned:
    name: hero iOS unsigned
    max_build_duration: 60
    environment:
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: pub get
        script: |
          flutter pub get
      - name: set display name
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 希罗" ios/Runner/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 希罗" ios/Runner/Info.plist
      - name: build ios unsigned
        script: |
          flutter build ios --release --no-codesign
      - name: package ipa
        script: |
          set -e
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../hero-unsigned.ipa Payload
          ls -lh ../hero-unsigned.ipa
    artifacts:
      - build/hero-unsigned.ipa
