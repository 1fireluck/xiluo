workflows:
  ios-unsigned:
    name: iOS 未签名包
    max_build_duration: 60
    environment:
      flutter: 3.24.5
    scripts:
      - name: 生成工程
        script: |
          flutter create --org com.fireluck --project-name xiluo --platforms=ios -t app .
      - name: 放入界面
        script: |
          cp seed/main.dart lib/main.dart
          flutter pub get
      - name: 显示名
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName hero" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string hero" ios/Runner/Info.plist
      - name: 换图标
        script: |
          cd ios/Runner/Assets.xcassets/AppIcon.appiconset
          rm -f *.png
          cp "$CM_BUILD_DIR/assets/icon.png" Icon-App-1024x1024@1x.png
          cat > Contents.json <<'EOF'
          { "images" : [ { "filename" : "Icon-App-1024x1024@1x.png", "idiom" : "universal", "platform" : "ios", "size" : "1024x1024" } ], "info" : { "author" : "xcode", "version" : 1 } }
          EOF
      - name: 编译
        script: |
          flutter build ios --release --no-codesign
      - name: 打包
        script: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr xiluo.ipa Payload
    artifacts:
      - xiluo.ipa