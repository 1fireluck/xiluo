name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: 造工程骨架
        run: flutter create --org com.fireluck --project-name xiluo -a ios -t app .

      - name: 放进我们的界面
        run: cp seed/main.dart lib/main.dart

      - name: 改显示名
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 希罗" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 希罗" ios/Runner/Info.plist

      - name: 取依赖
        run: flutter pub get

      - name: 编译（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包 ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr xiluo.ipa Payload
          ls -lh xiluo.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xiluo-ipa
          path: xiluo.ipa
